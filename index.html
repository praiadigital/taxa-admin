<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taxa Admin — Comparador de Administradoras | Praia Digital</title><meta name="description" content="Compare taxas de administradoras de temporada e descubra o ponto de equilíbrio entre autogestão e gestão terceirizada."><style>*{box-sizing:border-box;margin:0;font-family:system-ui,sans-serif}body{background:linear-gradient(160deg,#eaf4f6,#f7f3ea);padding:1rem;color:#123}.card{max-width:640px;margin:auto;background:#fff;border-radius:18px;padding:1.6rem;box-shadow:0 8px 30px #1e6a7a22}h1{color:#175a68;font-size:1.5rem}label{display:block;margin-top:1rem;font-weight:600;font-size:.9rem}input,select{width:100%;padding:.6rem;border:2px solid #cfe3e9;border-radius:10px;font-size:1rem}button{margin-top:1.4rem;width:100%;padding:.9rem;background:#1e6a7a;color:#fff;border:0;border-radius:12px;font-size:1.05rem;font-weight:700;cursor:pointer}#res{margin-top:1.4rem;display:none;background:#e8f4f7;border-radius:12px;padding:1rem}nav{max-width:640px;margin:1rem auto;font-size:.85rem;text-align:center}nav a{color:#1e6a7a;margin:0 .5rem;text-decoration:none}</style></head><body><nav><a href="https://praia.digital">🌊 Praia Digital</a> · <a href="https://praia.digital/area-anfitriao">Área do Anfitrião</a> · <a href="https://praia.digital/co-anfitriao">Co-Anfitrião</a> · <a href="https://praia.digital/fluxo-caixa">Fluxo de Caixa</a></nav><div class="card"><h1>📊 Taxa Admin</h1><p>15%, 20%, 25%... quanto a administradora realmente custa — e quando vale.</p><label>Receita bruta mensal de temporada (R$)</label><input id="r" type="number" value="6000"><label>Taxa da administradora (%)</label><select id="t"><option value="15">15% (básica: só reservas)</option><option value="20" selected>20% (completa)</option><option value="25">25% (full service + limpeza)</option></select><label>Suas horas semanais de autogestão</label><input id="h" type="number" value="8"><label>Valor da sua hora (R$)</label><input id="v" type="number" value="50"><button onclick="calc()">Comparar</button><div id="res"></div></div><script>function calc(){const g=id=>+document.getElementById(id).value;const r=g('r'),t=g('t')/100,h=g('h'),v=g('v');const taxa=r*t,tempo=h*4.33*v,liq=r-taxa;document.getElementById('res').style.display='block';document.getElementById('res').innerHTML=`<p>💸 Custo da administradora: <b>R$ ${taxa.toFixed(0)}/mês</b> (R$ ${(taxa*12).toLocaleString('pt-BR')}/ano) · líquido R$ ${liq.toFixed(0)}</p><p>⏱️ Custo do seu tempo na autogestão: <b>R$ ${tempo.toFixed(0)}/mês</b> (${h}h/sem)</p><p>${taxa<tempo?'✅ <b>Terceirizar vale a pena</b> no seu caso — seu tempo vale mais que a taxa.':'🤔 <b>Autogestão compensa financeiramente</b> — mas terceirize se o estresse pesar.'}</p><p>💡 Meio-termo: autogerencie com ferramentas da rede — <a href="https://praia.digital/area-anfitriao">Área do Anfitrião</a>, <a href="https://praia.digital/checkin-express">Check-in Express</a> e <a href="https://praia.digital/co-anfitriao">Co-Anfitrião</a>.</p>`}</script></body></html>
